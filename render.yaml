services:
  - type: web
    name: big-mamas-closet
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        value: big_mama_closet_secret_key_2026
      - key: DATABASE_URL
        fromDatabase:
          name: big-mamas-closet-db
          property: connectionString

databases:
  - name: big-mamas-closet-db
    plan: free
