{% extends "admin/base.html" %}
{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Categories</h2>
</div>
<div class="card p-4 mb-4">
    <h5 class="fw-bold mb-3">Add New Category</h5>
    <form method="POST" action="{{ url_for('add_category') }}" class="d-flex">
        <input type="text" name="name" class="form-control me-2" placeholder="Category name (e.g., Watches)" required>
        <button type="submit" class="btn btn-brand px-4">Add Category</button>
    </form>
</div>
<div class="card">
    <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
            <thead class="table-light"><tr><th class="ps-3">Category Name</th><th>Actions</th></tr></thead>
            <tbody>
                {% for cat in categories %}
                <tr>
                    <td class="ps-3 fw-bold">{{ cat.name }}</td>
                    <td>
                        <a href="{{ url_for('delete_category', id=cat.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this category?')"><i class="fas fa-trash"></i> Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
