{% extends "admin/base.html" %}
{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Videos</h2>
    <a href="{{ url_for('add_video') }}" class="btn btn-brand px-4"><i class="fas fa-plus me-2"></i>Add Video</a>
</div>
<div class="card">
    <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
                <tr><th class="ps-3">Title</th><th>Description</th><th>Date</th><th>Actions</th></tr>
            </thead>
            <tbody>
                {% for video in videos %}
                <tr>
                    <td class="ps-3 fw-bold">{{ video.title }}</td>
                    <td>{{ video.description[:80] }}...</td>
                    <td>{{ video.created_at[:10] }}</td>
                    <td>
                        <a href="{{ video.video_url }}" target="_blank" class="btn btn-sm btn-outline-info me-1"><i class="fas fa-play"></i></a>
                        <a href="{{ url_for('edit_video', id=video.id) }}" class="btn btn-sm btn-outline-primary me-1"><i class="fas fa-edit"></i></a>
                        <a href="{{ url_for('delete_video', id=video.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this video?')"><i class="fas fa-trash"></i></a>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="4" class="text-center text-muted py-4">No videos yet. Add your first video!</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
