{% extends "admin/base.html" %}
{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Products</h2>
    <a href="{{ url_for('add_product') }}" class="btn btn-brand px-4"><i class="fas fa-plus me-2"></i>Add Product</a>
</div>
<div class="card">
    <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
            <thead class="table-light"><tr><th class="ps-3">Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
            <tbody>
                {% for p in products %}
                <tr>
                    <td class="ps-3"><img src="{{ p.image_url }}" width="40" height="40" style="object-fit:cover;" class="rounded"></td>
                    <td class="fw-bold">{{ p.name }}</td>
                    <td>{{ p.category }}</td>
                    <td class="text-brand fw-bold">${{ "%.2f" % p.price }}</td>
                    <td>{{ p.stock }}</td>
                    <td>
                        <a href="{{ url_for('edit_product', id=p.id) }}" class="btn btn-sm btn-outline-primary me-1"><i class="fas fa-edit"></i></a>
                        <a href="{{ url_for('delete_product', id=p.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this item?')"><i class="fas fa-trash"></i></a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
