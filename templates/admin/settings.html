{% extends "admin/base.html" %}
{% block admin_content %}
<h2 class="fw-bold mb-4">Store Settings</h2>
<div class="card p-4">
    <form method="POST" enctype="multipart/form-data">
        <h5 class="fw-bold text-brand mb-3">1. Store Logo</h5>
        <div class="mb-4">
            <img src="{{ url_for('static', filename=settings.logo_filename) }}" alt="Current Logo" class="mb-2 border rounded" style="max-height: 80px;" onerror="this.style.display='none'">
            <input type="file" name="logo_file" class="form-control" accept="image/*">
            <small class="text-muted">Upload a new logo (replaces the old one).</small>
        </div>
        <hr>
        <h5 class="fw-bold text-brand mb-3">2. About Us Description</h5>
        <div class="mb-4">
            <textarea name="about_text" class="form-control" rows="4" required>{{ settings.about_text }}</textarea>
        </div>
        <hr>
        <h5 class="fw-bold text-brand mb-3">3. Customer Notification Banner</h5>
        <div class="mb-4">
            <input type="text" name="notification_text" class="form-control" value="{{ settings.notification_text }}" placeholder="e.g., Free delivery in Nairobi!">
            <small class="text-muted">Leave blank to hide the notification banner.</small>
        </div>
        <hr>
        <h5 class="fw-bold text-brand mb-3">4. Contact Information</h5>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="contact_phone" class="form-control" value="{{ settings.contact_phone }}" placeholder="+254 700 000 000" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="contact_email" class="form-control" value="{{ settings.contact_email }}" placeholder="info@bigmamascloset.co.ke" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Address</label>
                <input type="text" name="contact_address" class="form-control" value="{{ settings.contact_address }}" placeholder="Nairobi, Kenya" required>
            </div>
        </div>
        <button type="submit" class="btn btn-brand px-5 py-2 fw-bold">Save Settings</button>
    </form>
</div>
{% endblock %}
