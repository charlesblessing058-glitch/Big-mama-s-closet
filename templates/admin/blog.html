{% extends "admin/base.html" %}
{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Blog Posts</h2>
    <a href="{{ url_for('add_blog_post') }}" class="btn btn-brand px-4"><i class="fas fa-plus me-2"></i>Add Post</a>
</div>
<div class="card">
    <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
                <tr><th class="ps-3">Image</th><th>Title</th><th>Author</th><th>Views</th><th>Date</th><th>Actions</th></tr>
            </thead>
            <tbody>
                {% for post in posts %}
                <tr>
                    <td class="ps-3"><img src="{{ post.image_url }}" width="50" height="50" style="object-fit:cover;" class="rounded"></td>
                    <td class="fw-bold">{{ post.title }}</td>
                    <td>{{ post.author }}</td>
                    <td><i class="fas fa-eye text-muted me-1"></i> {{ post.views }}</td>
                    <td>{{ post.created_at[:10] }}</td>
                    <td>
                        <a href="{{ url_for('edit_blog_post', id=post.id) }}" class="btn btn-sm btn-outline-primary me-1"><i class="fas fa-edit"></i></a>
                        <a href="{{ url_for('delete_blog_post', id=post.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this post?')"><i class="fas fa-trash"></i></a>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="6" class="text-center text-muted py-4">No blog posts yet. Create your first post!</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
