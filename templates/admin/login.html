<!DOCTYPE html><html><head><title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:linear-gradient(135deg,#111 0%,#ff3366 100%);height:100vh;display:flex;align-items:center;justify-content:center;}.login-card{width:400px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.2);}.btn-brand{background:#ff3366;color:white;border:none;}.btn-brand:hover{background:#e62e5c;}</style>
</head><body>
<div class="card login-card p-5">
    <h3 class="text-center fw-bold mb-4">Admin Login</h3>
    {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="alert alert-{{category}}">{{message}}</div>{% endfor %}{% endif %}{% endwith %}
    <form method="POST">
        <div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn btn-brand w-100 py-2 fw-bold">Login</button>
    </form>
</div>
</body></html>
