{% extends "admin/base.html" %}
{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Portfolio</h2>
    <a href="{{ url_for('add_portfolio_item') }}" class="btn btn-brand px-4"><i class="fas fa-plus me-2"></i>Add Item</a>
</div>
<div class="card">
    <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
                <tr><th class="ps-3">Image</th><th>Title</th><th>Category</th><th>Date</th><th>Actions</th></tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td class="ps-3"><img src="{{ item.image_url }}" width="60" height="60" style="object-fit:cover;" class="rounded"></td>
                    <td class="fw-bold">{{ item.title }}</td>
                    <td><span class="badge bg-secondary">{{ item.category }}</span></td>
                    <td>{{ item.created_at[:10] }}</td>
                    <td>
                        <a href="{{ url_for('edit_portfolio_item', id=item.id) }}" class="btn btn-sm btn-outline-primary me-1"><i class="fas fa-edit"></i></a>
                        <a href="{{ url_for('delete_portfolio_item', id=item.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this item?')"><i class="fas fa-trash"></i></a>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="5" class="text-center text-muted py-4">No portfolio items yet. Add your first item!</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
