{% extends "admin/base.html" %}
{% block admin_content %}
<h2 class="fw-bold mb-4">{% if product %}Edit{% else %}Add{% endif %} Product</h2>
<div class="card p-4">
    <form method="POST" enctype="multipart/form-data">
        <div class="row">
            <div class="col-md-6 mb-3"><label class="form-label">Product Name</label><input type="text" name="name" class="form-control" value="{{ product.name if product else '' }}" required></div>
            <div class="col-md-3 mb-3"><label class="form-label">Current Price (KES)</label><input type="number" step="0.01" name="price" class="form-control" value="{{ product.price if product else '' }}" required></div>
            <div class="col-md-3 mb-3"><label class="form-label">Original Price (KES)</label><input type="number" step="0.01" name="original_price" class="form-control" value="{{ product.original_price if product else '' }}" placeholder="For slashed price"></div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-select" required>
                    <option value="">Select category...</option>
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if product and product.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3 mb-3"><label class="form-label">Stock</label><input type="number" name="stock" class="form-control" value="{{ product.stock if product else '10' }}" required></div>
            {% if product %}
            <div class="col-md-3 mb-3"><label class="form-label">Items Sold</label><input type="number" name="sold" class="form-control" value="{{ product.sold if product else '0' }}"></div>
            {% endif %}
        </div>
        <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3" required>{{ product.description if product else '' }}</textarea></div>
        <div class="mb-3">
            <label class="form-label">Product Image</label>
            <input type="file" name="image_file" class="form-control">
            {% if product and product.image_url %}<small class="text-muted d-block mt-1">Current: {{ product.image_url }}</small>{% endif %}
            <small class="text-muted">Or paste an image URL:</small>
            <input type="text" name="image_url" class="form-control mt-1" value="{{ product.image_url if product and 'http' in product.image_url else '' }}" placeholder="https://...">
        </div>
        <button type="submit" class="btn btn-brand px-5 py-2 fw-bold">Save Product</button>
        <a href="{{ url_for('admin_products') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
