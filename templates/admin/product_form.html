{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>{{ 'Edit Product' if product else 'Add New Product' }}</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label fw-bold">Product Name</label>
            <input type="text" name="name" class="form-control" value="{{ product.name if product else '' }}" required>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Price (KES)</label>
                <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price if product else '' }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Original Price (KES) - Optional</label>
                <input type="number" step="0.01" name="original_price" class="form-control" value="{{ product.original_price if product else '' }}">
            </div>
        </div>

          <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Category</label>
                <select name="category" class="form-select" required>
                    <option value="">Select Category</option>
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if product and product.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Stock Quantity</label>
                <input type="number" name="stock" class="form-control" value="{{ product.stock if product else '0' }}" required>
            </div>
        </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Stock Quantity</label>
                <input type="number" name="stock" class="form-control" value="{{ product.stock if product else '0' }}" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Product Description</label>
            <textarea name="description" class="form-control" rows="4">{{ product.description if product else '' }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Product Image</label>
            
            <!-- File Upload -->
            <input type="file" name="image_file" class="form-control mb-2" accept="image/*">
            
            <!-- URL Input (CRITICAL: name must be exactly "image_url") -->
            <label class="form-label small text-muted">Or paste an image URL:</label>
            <input type="text" name="image_url" class="form-control" 
                   value="{{ product.image_url if product else '' }}" 
                   placeholder="https://images.unsplash.com/...">
            <small class="text-muted">Tip: Use a link from Unsplash or Imgur for permanent images.</small>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> {{ 'Update Product' if product else 'Add Product' }}
        </button>
        <a href="{{ url_for('admin_products') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
